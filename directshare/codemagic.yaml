workflows:

  # ── ANDROID BUILD ──────────────────────────────
  android-release:
    name: DirectShare Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      flutter: 3.19.6
      java: 17

    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> "$CM_BUILD_DIR/android/local.properties"

      - name: Get Flutter packages
        script: flutter pub get

      - name: Analyze
        script: flutter analyze --no-fatal-infos || true

      - name: Build debug APK
        script: |
          flutter build apk --debug \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER

      - name: Build release APK
        script: |
          flutter build apk --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
      - build/app/outputs/flutter-apk/app-release.apk

    publishing:
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true

  # ── iOS BUILD ──────────────────────────────────
  ios-release:
    name: DirectShare iOS IPA
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      flutter: 3.19.6
      xcode: latest
      cocoapods: default
      # Add your Apple credentials in Codemagic UI:
      # Settings > Teams > Integrations > Apple Developer Portal
      ios_signing:
        distribution_type: app_store   # or: ad_hoc
        bundle_identifier: com.directshare.app

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios && pod install

      - name: Analyze
        script: flutter analyze --no-fatal-infos || true

      - name: Build iOS IPA
        script: |
          flutter build ipa \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true
      # Uncomment to publish to App Store Connect:
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
