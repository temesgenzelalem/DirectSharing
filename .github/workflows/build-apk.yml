name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release (direct APK download link)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: flutter doctor -v

      - name: Ensure local.properties exists
        run: |
          mkdir -p android
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          cat android/local.properties

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-infos || true

      - name: Run tests
        run: flutter test || true

      - name: Build Android Release APK
        run: |
          flutter build apk --release --build-name=1.0.0 --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/DirectShare-latest.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/DirectShare-v1.0.0-${{ github.run_number }}.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DirectShare-APK-build-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/DirectShare-latest.apk
            build/app/outputs/flutter-apk/DirectShare-v1.0.0-${{ github.run_number }}.apk
          retention-days: 30

      - name: Determine Release Tag and Name
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "RELEASE_TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=DirectShare Release ${{ github.ref_name }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=v1.0.0-build.${{ github.run_number }}" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=DirectShare Build #${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            ## DirectShare Android Release (Build #${{ github.run_number }})
            Built automatically in the cloud via GitHub Actions.

            ### Download APK:
            - **DirectShare-latest.apk** (Universal APK — compatible with all Android devices)
            - **DirectShare-v1.0.0-${{ github.run_number }}.apk**

            ### How to Install on your Android phone:
            1. Download the `.apk` file from Assets below directly onto your phone.
            2. Tap the downloaded file to install.
            3. If Android displays a prompt, enable **"Install unknown apps"** for your browser or file manager.
          files: |
            build/app/outputs/flutter-apk/DirectShare-latest.apk
            build/app/outputs/flutter-apk/DirectShare-v1.0.0-${{ github.run_number }}.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
